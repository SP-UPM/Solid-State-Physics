<title>PHY3201 Course Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* PHY3201 Solid State Physics — Course Studio
   Light-only by design: these pages are projected in lecture halls and printed.

   PALETTE SOURCE. Sampled from the official UPM artwork, which contains exactly three
   colours: crimson #C8244B (55% of non-white pixels), warm grey #939090 (36%), and the
   wordmark black #35363A (3%). There is no navy in the logo — the navy this studio used
   until now came from the PHY4230 figure set, not from the identity.

   So: headings and brand furniture take the wordmark black, warmed and deepened; the
   crimson is the single brand accent; and the whole neutral ramp is biased warm to sit
   with the logo's grey rather than fighting it.

   Every text colour below clears WCAG AA (4.5:1) on both --paper and --paper-2.
   If you change one, re-check it — the physics accents are close to the line. */

:root{
  color-scheme: light;

  /* ── Brand. --navy is a legacy variable NAME kept so the 42 existing references keep
        working; its VALUE is now the warm charcoal taken from the UPM wordmark. ── */
  --navy:        #23242A;   /* headings, brand text, active nav      15.5:1 on white */
  --navy-700:    #33343B;   /* h3                                    12.4:1          */
  --navy-500:    #A81E3F;   /* links and interactive accent           7.2:1          */

  /* ── UPM crimson, sampled from the artwork. The one brand accent. ── */
  --crimson:     #C8244B;   /* rules, chips, markers                  5.5:1          */
  --crimson-050: #FCEEF1;

  /* solid-state accents, one per physics domain — semantic, not decorative:
     these colour-code the 41 mechanism diagrams and must stay distinguishable */
  --structure:   #1B5AAE;   /* Topics 1–2  crystal geometry           6.7:1 */
  --diffraction: #6B3FA0;   /* Topics 3–4  waves and reciprocal space 7.4:1 */
  --bonding:     #147A5E;   /* Topic 5     binding                    5.3:1 */
  --phonon:      #A85F12;   /* Topics 6–7  lattice dynamics           4.9:1 */
  --electron:    #0B6C86;   /* Topics 8–9  electrons and bands        6.0:1 */

  /* neutrals — warm, derived from the logo's #939090 rather than a cool blue-grey */
  --ink:         #1B1C20;
  --ink-2:       #45464C;
  --ink-3:       #6E6F76;
  --rule:        #DEDCD9;
  --rule-2:      #EDEBE8;
  --paper:       #FFFFFF;
  --paper-2:     #F8F7F5;
  --paper-3:     #F0EEEB;

  /* semantic states — deliberately separate from the brand accent */
  --ok:          #15704A;
  --ok-bg:       #EAF6F0;
  --warn:        #8A5A00;
  --warn-bg:     #FDF4E3;
  --stop:        #8E1938;
  --stop-bg:     #FBECEF;

  --sans: "Inter", "Aptos", "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;

  --sidebar-w: 290px;
  --brandbar-h: 62px;
  --measure: 74ch;

  --shadow-1: 0 1px 2px rgba(20,24,31,.05), 0 1px 3px rgba(20,24,31,.07);
  --shadow-2: 0 2px 6px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.08);
  --r: 10px;
}

*,*::before,*::after{ box-sizing:border-box; }
/* The `hidden` attribute is only display:none in the UA sheet, so ANY author display rule
   beats it. Without this the brand-bar fallback renders alongside the logo. The artifact
   shell sets the same rule, which is why the bug was invisible there. Keep it. */
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--paper-2); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.62;
  font-feature-settings:"kern" 1,"liga" 1,"cv05" 1;
}
img{ max-width:100%; height:auto; }
a{ color:var(--navy-500); text-underline-offset:2px; }
a:hover{ color:var(--crimson); }
:focus-visible{ outline:3px solid var(--navy-500); outline-offset:2px; border-radius:4px; }

/* ─── brand bar ─────────────────────────────────────────────── */
.brandbar{
  position:fixed; inset:0 0 auto 0; height:var(--brandbar-h); z-index:60;
  display:flex; align-items:center; gap:14px; padding:0 18px;
  background:var(--paper); border-bottom:1px solid var(--rule);
}
.brandbar__logolink{ display:flex; align-items:center; gap:10px; flex:none; line-height:0; border-radius:4px; text-decoration:none; }
.brandbar__logo{ height:38px; width:auto; display:block; }
/* Shown only while the official logo file is absent. A lattice glyph from the course's own
   figure language plus the university name in type — deliberately not an invented crest. */
.brandbar__mark{ display:flex; align-items:center; gap:9px; flex:none; }
.brandbar__glyph{ width:27px; height:27px; flex:none; color:var(--navy); fill:currentColor; }
.brandbar__univ{
  font-size:10px; font-weight:750; letter-spacing:.075em; text-transform:uppercase;
  color:var(--ink-3); line-height:1.3; white-space:nowrap;
}
@media (max-width:700px){ .brandbar__univ{ display:none; } }
.brandbar__code{ font-weight:800; color:var(--navy); letter-spacing:.01em; font-size:15px; }
.brandbar__sep{ width:1px; height:22px; background:var(--rule); }
.brandbar__title{ color:var(--ink-3); font-size:14px; font-weight:600; }
.brandbar__spacer{ flex:1; }
.brandbar__meta{ color:var(--ink-3); font-size:12.5px; font-variant-numeric:tabular-nums; }
.menu-btn{
  display:none; appearance:none; border:1px solid var(--rule); background:var(--paper);
  border-radius:8px; width:38px; height:38px; cursor:pointer; align-items:center; justify-content:center;
}
.menu-btn span{ display:block; width:17px; height:2px; background:var(--navy); position:relative; }
.menu-btn span::before,.menu-btn span::after{
  content:""; position:absolute; left:0; width:17px; height:2px; background:var(--navy);
}
.menu-btn span::before{ top:-5px; } .menu-btn span::after{ top:5px; }

/* ─── layout ────────────────────────────────────────────────── */
.shell{ display:flex; padding-top:var(--brandbar-h); min-height:100vh; }

.sidebar{
  position:fixed; top:var(--brandbar-h); bottom:0; left:0; width:var(--sidebar-w); z-index:50;
  background:var(--paper); border-right:1px solid var(--rule);
  overflow-y:auto; overscroll-behavior:contain; padding:16px 0 40px;
}
.sidebar__progress{ padding:0 18px 14px; }
.sidebar__progress-label{
  display:flex; justify-content:space-between; font-size:12px; font-weight:700;
  color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;
}
.bar{ height:6px; border-radius:99px; background:var(--paper-3); overflow:hidden; }
.bar>i{ display:block; height:100%; background:linear-gradient(90deg,var(--crimson),var(--navy)); border-radius:99px; transition:width .35s ease; }

.navgroup{ margin:14px 0 2px; padding:0 18px; }
.navgroup__label{
  font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); padding:8px 0 4px; border-top:1px solid var(--rule-2);
}
.navgroup:first-of-type .navgroup__label{ border-top:0; }
.nav a{
  display:flex; align-items:center; gap:9px; padding:7px 18px 7px 18px;
  color:var(--ink-2); text-decoration:none; font-size:14.2px; font-weight:500;
  border-left:3px solid transparent;
}
.nav a:hover{ background:var(--paper-2); color:var(--navy); }
.nav a.is-active{ background:var(--paper-3); color:var(--navy); font-weight:700; border-left-color:var(--navy); }
.nav a .dot{ width:7px; height:7px; border-radius:99px; flex:none; background:var(--rule); }
.nav a.done .dot{ background:var(--ok); }
.nav a .num{
  font-variant-numeric:tabular-nums; font-size:11.5px; font-weight:700; color:var(--ink-3);
  min-width:17px; text-align:right;
}
.nav a.is-active .num{ color:var(--navy); }

.main{ flex:1; min-width:0; margin-left:var(--sidebar-w); }
.wrap{ max-width:960px; margin:0 auto; padding:30px 30px 90px; }

/* ─── page furniture ────────────────────────────────────────── */
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:10px;
}
.eyebrow .chip{
  background:var(--paper-3); color:var(--navy); border-radius:99px; padding:3px 9px; letter-spacing:.05em;
}
h1{ font-size:33px; line-height:1.2; letter-spacing:-.018em; margin:.1em 0 .3em; color:var(--navy); font-weight:800; }
.lede{ font-size:18px; line-height:1.6; color:var(--ink-2); max-width:var(--measure); margin:0 0 4px; }
h2{ font-size:22px; line-height:1.3; letter-spacing:-.012em; margin:2.1em 0 .5em; color:var(--navy); font-weight:750; scroll-margin-top:calc(var(--brandbar-h) + 14px); }
h3{ font-size:16.5px; margin:1.7em 0 .4em; color:var(--navy-700); font-weight:700; }
p{ margin:0 0 1.05em; max-width:var(--measure); }
ul,ol{ margin:0 0 1.1em; padding-left:1.25em; max-width:var(--measure); }
li{ margin:.3em 0; }
li::marker{ color:var(--ink-3); }
strong{ font-weight:680; color:var(--ink); }
code{ font-family:var(--mono); font-size:.9em; background:var(--paper-3); padding:.1em .35em; border-radius:4px; }
hr.rule{ border:0; border-top:1px solid var(--rule); margin:2.4em 0; }

/* topic accent bar */
.accentbar{ height:4px; border-radius:99px; margin-bottom:18px; background:var(--navy-500); }
[data-accent="brand"]       .accentbar{ background:var(--crimson); }
[data-accent="structure"]   .accentbar{ background:var(--structure); }
[data-accent="diffraction"] .accentbar{ background:var(--diffraction); }
[data-accent="bonding"]     .accentbar{ background:var(--bonding); }
[data-accent="phonon"]      .accentbar{ background:var(--phonon); }
[data-accent="electron"]    .accentbar{ background:var(--electron); }

/* ─── equations ─────────────────────────────────────────────── */
.eq{
  margin:1.25em 0; padding:15px 18px; background:var(--paper); border:1px solid var(--rule);
  border-left:3px solid var(--navy-500); border-radius:var(--r); box-shadow:var(--shadow-1);
  overflow-x:auto;
}
.eq__body{ font-family:var(--mono); font-size:15.5px; line-height:1.85; color:var(--ink); white-space:pre-wrap; }
.eq__note{ margin-top:8px; font-size:13.4px; color:var(--ink-3); font-family:var(--sans); }
.eq--tight{ padding:10px 14px; }

/* ─── callouts ──────────────────────────────────────────────── */
.callout{ margin:1.3em 0; padding:14px 16px; border-radius:var(--r); border:1px solid var(--rule); background:var(--paper); box-shadow:var(--shadow-1); }
.callout__title{ font-weight:750; font-size:14px; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
.callout p:last-child{ margin-bottom:0; }
.callout--key{ background:#FBF6F7; border-color:#E8D5DA; } .callout--key .callout__title{ color:var(--navy); }
.callout--note{ background:var(--paper-2); } .callout--note .callout__title{ color:var(--ink-2); }
.callout--warn{ background:var(--warn-bg); border-color:#EBD5A8; } .callout--warn .callout__title{ color:var(--warn); }
.callout--stop{ background:var(--stop-bg); border-color:#EECAD1; } .callout--stop .callout__title{ color:var(--stop); }
.callout--ok{ background:var(--ok-bg); border-color:#BFE0CF; } .callout--ok .callout__title{ color:var(--ok); }

/* common-error block */
.errbox{ margin:1.3em 0; border:1px solid #EECAD1; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow-1); }
.errbox__claim{ background:var(--stop-bg); padding:12px 16px; font-weight:600; color:var(--stop); }
.errbox__claim::before{ content:"✕ "; font-weight:800; }
.errbox__why{ background:var(--paper); padding:12px 16px; font-size:15px; }
.errbox__why::before{ content:"Why it is wrong. "; font-weight:750; color:var(--ok); }

/* ─── calculation corner ────────────────────────────────────── */
.calc{ margin:1.5em 0; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper); box-shadow:var(--shadow-2); overflow:hidden; }
.calc__head{ background:var(--navy); color:#fff; padding:11px 16px; font-weight:750; font-size:14.5px; display:flex; align-items:center; gap:9px; }
.calc__head .tag{ background:rgba(255,255,255,.16); border-radius:99px; padding:2px 9px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:800; }
.calc__row{ display:grid; grid-template-columns:118px 1fr; gap:0; border-top:1px solid var(--rule-2); }
.calc__row:first-of-type{ border-top:0; }
.calc__k{ background:var(--paper-2); padding:11px 14px; font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); border-right:1px solid var(--rule-2); }
.calc__v{ padding:11px 15px; font-size:15px; }
.calc__v .m{ font-family:var(--mono); font-size:14.3px; white-space:pre-wrap; display:block; }
.calc__row--answer .calc__v{ background:var(--ok-bg); font-weight:700; }
.calc__row--answer .calc__k{ color:var(--ok); }

/* ─── tables ────────────────────────────────────────────────── */
.tablewrap{ overflow-x:auto; margin:1.3em 0; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper); box-shadow:var(--shadow-1); }
table{ border-collapse:collapse; width:100%; font-size:14.4px; }
th,td{ text-align:left; padding:9px 13px; border-bottom:1px solid var(--rule-2); vertical-align:top; }
thead th{ background:var(--paper-3); color:var(--navy); font-weight:750; font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
tbody tr:last-child td{ border-bottom:0; }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:13.6px; }

/* ─── diagrams ──────────────────────────────────────────────── */
.figure{ margin:1.6em 0; }
.figure__frame{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:14px; box-shadow:var(--shadow-1); overflow-x:auto; }
.figure__frame svg{ display:block; margin:0 auto; max-width:100%; height:auto; }
.figure__cap{ margin-top:9px; font-size:13.4px; color:var(--ink-3); max-width:var(--measure); }
.figure__cap b{ color:var(--ink-2); font-weight:700; }

/* ─── glossary term ─────────────────────────────────────────── */
.gterm{
  border-bottom:1px dotted var(--navy-500); cursor:help; text-decoration:none;
  color:inherit; background:linear-gradient(transparent 78%, #E3ECFA 78%);
}
.gpop{
  position:absolute; z-index:80; max-width:330px; background:var(--navy); color:#fff;
  border-radius:8px; padding:10px 12px; font-size:13.2px; line-height:1.5; box-shadow:var(--shadow-2);
}
.gpop b{ display:block; margin-bottom:3px; color:#CFE0FF; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }

/* ─── inline check ──────────────────────────────────────────── */
.check{ margin:1.4em 0; border:1px solid #E8D5DA; background:#FBF6F7; border-radius:var(--r); padding:14px 16px; }
.check__q{ font-weight:700; margin-bottom:10px; }
.check__opts{ display:grid; gap:7px; }
.opt{
  display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
  background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:9px 12px;
  font:inherit; font-size:14.6px; cursor:pointer; color:var(--ink);
}
.opt:hover{ border-color:var(--navy-500); }
.opt .k{ font-weight:800; color:var(--ink-3); min-width:15px; }
.opt.is-right{ background:var(--ok-bg); border-color:#8FCBAE; }
.opt.is-wrong{ background:var(--stop-bg); border-color:#E2A7B2; }
.opt[disabled]{ cursor:default; }
.check__why{ margin-top:10px; font-size:14.2px; padding:10px 12px; background:var(--paper); border-radius:8px; border:1px solid var(--rule); }
.check__why.hidden{ display:none; }

/* ─── read-more ─────────────────────────────────────────────── */
.read{ margin:1.6em 0; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper-2); padding:14px 16px; }
.read__t{ font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; }
.read ul{ margin:0; padding-left:0; list-style:none; }
.read li{ display:grid; grid-template-columns:150px 1fr; gap:10px; padding:5px 0; border-top:1px solid var(--rule-2); font-size:14.2px; }
.read li:first-child{ border-top:0; }
.read li b{ color:var(--navy); font-weight:700; }
@media (max-width:620px){ .read li{ grid-template-columns:1fr; gap:0; } }

/* ─── widget shell ──────────────────────────────────────────── */
.widget{ margin:1.7em 0; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper); box-shadow:var(--shadow-2); overflow:hidden; }
.widget__head{ padding:12px 16px; border-bottom:1px solid var(--rule); background:var(--paper-2); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.widget__title{ font-weight:750; font-size:15px; color:var(--navy); }
.widget__tag{ font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#fff; background:var(--navy-500); border-radius:99px; padding:3px 9px; }
.widget__body{ padding:16px; }
.controls{ display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end; margin-bottom:14px; }
.ctrl{ display:flex; flex-direction:column; gap:5px; min-width:150px; }
.ctrl label{ font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.ctrl input[type=range]{ width:100%; accent-color:var(--navy-500); }
.ctrl input[type=number], .ctrl select{
  font:inherit; font-size:14.5px; padding:7px 9px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink);
}
.ctrl .val{ font-family:var(--mono); font-size:13.5px; color:var(--navy); font-weight:700; }
.segmented{ display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
.segmented button{ font:inherit; font-size:13.6px; font-weight:600; padding:7px 13px; background:var(--paper); border:0; border-left:1px solid var(--rule); cursor:pointer; color:var(--ink-2); }
.segmented button:first-child{ border-left:0; }
.segmented button.is-on{ background:var(--navy); color:#fff; }
.readout{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.stat{ flex:1 1 130px; background:var(--paper-2); border:1px solid var(--rule); border-radius:8px; padding:9px 12px; }
.stat__k{ font-size:10.8px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); }
.stat__v{ font-family:var(--mono); font-size:16px; font-weight:700; color:var(--navy); margin-top:2px; }
.stat__v small{ font-family:var(--sans); font-size:11.5px; color:var(--ink-3); font-weight:600; }
.btn{ font:inherit; font-size:14px; font-weight:650; padding:8px 15px; border-radius:8px; border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; }
.btn:hover{ background:var(--navy-700); }
.btn--ghost{ background:var(--paper); color:var(--navy); }
.btn--ghost:hover{ background:var(--paper-3); }
.svgstage{ background:var(--paper-2); border:1px solid var(--rule-2); border-radius:8px; padding:8px; overflow-x:auto; }
.svgstage svg{ display:block; margin:0 auto; }

/* ─── cards / grids ─────────────────────────────────────────── */
.grid{ display:grid; gap:14px; margin:1.4em 0; }
.grid--2{ grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); }
.grid--3{ grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
.grid--4{ grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); }
.card{ background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow-1); }
.card h3{ margin-top:0; }
.card p:last-child{ margin-bottom:0; }
.card--link{ text-decoration:none; color:inherit; display:block; transition:border-color .15s, transform .15s; }
.card--link:hover{ border-color:var(--navy-500); transform:translateY(-1px); box-shadow:var(--shadow-2); }
.card__k{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.card__big{ font-size:26px; font-weight:800; color:var(--navy); font-variant-numeric:tabular-nums; line-height:1.15; margin:3px 0; }

/* topic index cards */
.tcard{ display:grid; grid-template-columns:46px 1fr; gap:13px; align-items:start; text-decoration:none; color:inherit; background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:14px 15px; box-shadow:var(--shadow-1); }
.tcard:hover{ border-color:var(--navy-500); box-shadow:var(--shadow-2); }
.tcard__n{ width:46px; height:46px; border-radius:9px; display:grid; place-items:center; font-weight:800; font-size:18px; color:#fff; background:var(--navy-500); }
.tcard__t{ font-weight:750; color:var(--navy); font-size:15.5px; line-height:1.3; }
.tcard__m{ font-size:12.8px; color:var(--ink-3); margin-top:3px; }
.tcard__d{ font-size:14px; color:var(--ink-2); margin-top:6px; }

/* ─── stepper / prev-next ───────────────────────────────────── */
.pager{ display:flex; gap:12px; justify-content:space-between; margin-top:44px; padding-top:22px; border-top:1px solid var(--rule); }
.pager a{ flex:1 1 0; text-decoration:none; background:var(--paper); border:1px solid var(--rule); border-radius:var(--r); padding:12px 15px; color:inherit; box-shadow:var(--shadow-1); max-width:48%; }
.pager a:hover{ border-color:var(--navy-500); }
.pager__k{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); }
.pager__t{ font-weight:700; color:var(--navy); margin-top:2px; font-size:14.6px; }
.pager a.next{ text-align:right; margin-left:auto; }

/* ─── practice hub ──────────────────────────────────────────── */
.filters{ display:flex; flex-wrap:wrap; gap:8px; margin:1em 0 1.4em; }
.pill{ font:inherit; font-size:13.2px; font-weight:600; padding:6px 13px; border-radius:99px; border:1px solid var(--rule); background:var(--paper); cursor:pointer; color:var(--ink-2); }
.pill.is-on{ background:var(--navy); border-color:var(--navy); color:#fff; }
.q{ margin:14px 0; border:1px solid var(--rule); border-radius:var(--r); background:var(--paper); box-shadow:var(--shadow-1); overflow:hidden; }
.q__head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 15px; background:var(--paper-2); border-bottom:1px solid var(--rule-2); font-size:11.5px; }
.q__id{ font-family:var(--mono); font-weight:700; color:var(--ink-3); }
.badge{ font-size:10.6px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border-radius:99px; padding:3px 9px; background:var(--paper-3); color:var(--navy); }
.badge--f{ background:var(--ok-bg); color:var(--ok); }
.badge--c{ background:var(--warn-bg); color:var(--warn); }
.badge--m{ background:#EAF0F8; color:var(--structure); }
.q__body{ padding:14px 15px; }
.q__prompt{ font-weight:600; margin-bottom:10px; }
.q__tools{ display:flex; gap:8px; flex-wrap:wrap; margin-top:11px; }
.q__reveal{ margin-top:11px; border-top:1px dashed var(--rule); padding-top:11px; font-size:14.6px; }
.q__reveal.hidden{ display:none; }
.q__reveal .lbl{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); display:block; margin:9px 0 3px; }
.empty{ padding:26px; text-align:center; color:var(--ink-3); background:var(--paper); border:1px dashed var(--rule); border-radius:var(--r); }

/* ─── misc ──────────────────────────────────────────────────── */
.kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:14.4px; margin:1em 0; }
.kv dt{ font-weight:700; color:var(--ink-3); }
.kv dd{ margin:0; }
.tag{ display:inline-block; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:3px 9px; border-radius:99px; background:var(--paper-3); color:var(--navy); }
.hidden{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip{ position:absolute; left:-9999px; top:0; background:var(--navy); color:#fff; padding:10px 16px; z-index:100; }
.skip:focus{ left:8px; top:8px; }

/* ─── responsive ────────────────────────────────────────────── */
@media (max-width:820px){
  .brandbar__logo{ height:32px; }
  .brandbar__title{ display:none; }
  .brandbar__sep{ display:none; }
}
@media (max-width:1000px){
  .menu-btn{ display:flex; }
  .sidebar{ transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow-2); }
  body.nav-open .sidebar{ transform:none; }
  .main{ margin-left:0; }
  .wrap{ padding:22px 18px 80px; }
  h1{ font-size:27px; }
  .scrim{ position:fixed; inset:var(--brandbar-h) 0 0 0; background:rgba(20,24,31,.35); z-index:45; }
}
@media (max-width:560px){
  .calc__row{ grid-template-columns:1fr; }
  .calc__k{ border-right:0; border-bottom:1px solid var(--rule-2); padding:7px 14px; }
  .pager{ flex-direction:column; } .pager a{ max-width:none; } .pager a.next{ text-align:left; }
}

/* ─── print ─────────────────────────────────────────────────── */
@media print{
  .brandbar,.sidebar,.pager,.menu-btn,.scrim,.filters,.q__tools{ display:none !important; }
  .shell{ padding-top:0; } .main{ margin-left:0; } .wrap{ max-width:none; padding:0; }
  body{ background:#fff; font-size:11pt; }
  .page{ display:block !important; page-break-after:always; }
  .widget,.check{ break-inside:avoid; }
  .q__reveal{ display:block !important; }
  a{ color:inherit; text-decoration:none; }
  .eq,.calc,.card,.figure__frame,.tablewrap{ box-shadow:none; }
}

/* ==== assets/js/glossary.js ==== */
/* PHY3201 glossary. Terms are auto-linked into page prose on FIRST occurrence only

   Keep definitions to one or two sentences — they render inside a tooltip. */
window.PHY3201 = window.PHY3201 || {};

window.PHY3201.glossary = {
  "lattice": "An infinite periodic array of points, each of which has an identical environment. A lattice is pure geometry — it contains no atoms.",
  "basis": "The group of atoms attached to every lattice point. Lattice + basis = crystal structure.",
  "crystal structure": "The actual atomic arrangement: a lattice with a basis placed at every lattice point.",
  "primitive cell": "The smallest cell that fills all space by lattice translations. It contains exactly one lattice point (though it may contain several atoms).",
  "conventional cell": "A larger cell chosen to display the full symmetry of the crystal. The FCC conventional cell contains 4 lattice points.",
  "Wigner–Seitz cell": "The primitive cell built as the region closer to one lattice point than to any other. Built in reciprocal space it is the first Brillouin zone.",
  "Bravais lattice": "One of the 14 distinct three-dimensional lattice types. Every crystal lattice belongs to exactly one of them.",
  "crystal system": "One of the seven classes of unit-cell shape, defined by the relations between a, b, c and α, β, γ.",
  "lattice parameter": "The edge length of the conventional unit cell, usually written a. For silicon a = 0.5431 nm.",
  "coordination number": "The number of nearest neighbours surrounding an atom. SC 6, BCC 8, FCC 12.",
  "Miller indices": "The three integers (hkl) obtained by taking reciprocals of a plane's axis intercepts and clearing fractions. They label a family of parallel planes.",
  "atomic packing fraction": "The fraction of the unit-cell volume filled by hard-sphere atoms. SC 0.52, BCC 0.68, FCC 0.74.",
  "planar density": "Atoms per unit area on a given crystallographic plane. It depends on which plane you cut, which is why etching and growth are plane-dependent.",
  "polycrystal": "A solid made of many small single-crystal grains with different orientations, separated by grain boundaries.",
  "vacancy": "A point defect in which an atom is missing from a lattice site. Present in every real crystal above 0 K for thermodynamic reasons.",
  "dislocation": "A line defect. Edge dislocations carry an extra half-plane of atoms and are what allows metals to deform plastically.",
  "grain boundary": "The interface between two crystallites of different orientation. It scatters both phonons and electrons.",
  "Bragg's law": "nλ = 2d sin θ. The condition for constructive interference between waves reflected from successive lattice planes.",
  "reciprocal lattice": "The Fourier-space lattice whose vectors G satisfy exp(iG·R) = 1 for every direct lattice vector R. Large real spacings map to short reciprocal vectors.",
  "atomic form factor": "The scattering amplitude of a single atom, written f. It falls off with angle because the electron cloud is comparable in size to the wavelength.",
  "structure factor": "The sum of scattered amplitudes from all atoms in one unit cell, including their relative phases. F = 0 gives a systematic absence.",
  "systematic absence": "A reflection that satisfies Bragg's law but has zero intensity because the waves from atoms in the basis cancel exactly.",
  "Brillouin zone": "The Wigner–Seitz cell of the reciprocal lattice. Its boundary is where the Bragg condition is met, and where energy gaps open.",
  "Ewald construction": "The geometric statement of the diffraction condition: a reflection occurs only when a reciprocal-lattice point lies on a sphere of radius |k|.",
  "Laue equations": "The three simultaneous conditions on the scattering vector that are equivalent to Bragg's law.",
  "cohesive energy": "The energy needed to separate a crystal into neutral free atoms. It sets the melting point scale.",
  "Lennard-Jones potential": "U(r) = 4ε[(σ/r)¹² − (σ/r)⁶]. The standard model potential for inert-gas crystals.",
  "van der Waals": "The weak attraction between neutral atoms arising from fluctuating dipoles. Its energy falls off as −1/r⁶.",
  "Madelung constant": "The dimensionless number that sums the electrostatic interactions of one ion with the whole ionic lattice. NaCl: 1.7476.",
  "harmonic approximation": "Expanding the interatomic potential to second order about equilibrium, so that the restoring force is proportional to displacement.",
  "phonon": "A quantum of lattice vibrational energy, ħω. Phonons carry heat and scatter electrons.",
  "dispersion relation": "The function ω(k) giving the frequency of a vibrational mode in terms of its wavevector.",
  "acoustic branch": "The vibrational branch in which neighbouring atoms move in phase. ω → 0 as k → 0; at long wavelength it is a sound wave.",
  "optical branch": "The vibrational branch in which the two atoms of the basis move out of phase. It has finite frequency at k = 0 and couples to infrared light.",
  "group velocity": "v_g = dω/dk. The speed at which a wave packet — and therefore vibrational energy — actually travels. It is zero at the zone boundary.",
  "umklapp process": "A phonon-phonon collision whose total wavevector falls outside the first Brillouin zone and must be folded back by a reciprocal-lattice vector. Umklapp processes are what give a crystal thermal resistance.",
  "Debye model": "Treats lattice vibrations as a continuum of acoustic modes up to a cutoff frequency. Predicts C_V ∝ T³ at low temperature, matching experiment.",
  "Einstein model": "Treats every atom as an independent oscillator at a single frequency. Correct at high T, but falls off exponentially — too fast — at low T.",
  "Debye temperature": "Θ_D = ħω_D/k_B. The temperature scale above which essentially all lattice modes are excited. Diamond 2230 K, lead 105 K.",
  "Dulong–Petit law": "The classical result C_V = 3Nk_B, independent of temperature and material. It holds only well above the Debye temperature.",
  "thermal conductivity": "κ ≈ ⅓ c_V v ℓ for a phonon gas: heat capacity × velocity × mean free path.",
  "mean free path": "The average distance a phonon or electron travels between scattering events.",
  "Drude model": "The classical picture of a metal as free electrons scattering off ion cores, giving σ = ne²τ/m. Right about Ohm's law, wrong about heat capacity.",
  "Fermi energy": "The energy of the highest occupied electron state at T = 0. For sodium it is about 3.2 eV.",
  "Fermi surface": "The surface in k-space separating occupied from empty states at T = 0. For a free-electron gas it is a sphere.",
  "Fermi velocity": "The speed of an electron at the Fermi surface, of order 10⁶ m s⁻¹ in metals — far larger than the drift velocity.",
  "drift velocity": "The small net velocity superimposed on the electrons' random motion by an applied field. Typically 10⁻⁴ m s⁻¹.",
  "Fermi–Dirac distribution": "f(E) = 1/(exp[(E−μ)/k_BT] + 1). The occupation probability of an electron state.",
  "density of states": "g(E), the number of available states per unit energy. In a 3-D free-electron gas g(E) ∝ √E.",
  "Hall effect": "The transverse voltage that appears when a current-carrying conductor sits in a magnetic field. Its sign reveals the sign of the carriers.",
  "Wiedemann–Franz law": "The ratio of thermal to electrical conductivity in a metal is proportional to temperature, with a nearly universal constant.",
  "Bloch's theorem": "In a periodic potential every electron eigenstate can be written ψ(r) = u(r)exp(ik·r) with u having the periodicity of the lattice.",
  "nearly free electron model": "Treats the crystal potential as a weak perturbation on free electrons. It is enough to open gaps at the zone boundaries.",
  "Kronig–Penney model": "An exactly solvable one-dimensional periodic square-well potential that produces allowed bands and forbidden gaps.",
  "band gap": "A range of energies for which no electron states exist. Silicon 1.12 eV, diamond 5.5 eV, GaN about 3.4 eV.",
  "effective mass": "The mass an electron appears to have in a crystal, set by the curvature of the band: m* = ħ²/(d²E/dk²).",
  "valence band": "The highest fully occupied band at T = 0.",
  "conduction band": "The lowest band that is empty at T = 0 in a semiconductor or insulator.",
  "CLO": "Course Learning Outcome — the statement of what a student should be able to do by the end of the course.",
  "PLO": "Programme Learning Outcome — the degree-level outcome that each CLO maps onto."
};

/* PHY3201 — hand-authored SVG mechanism diagrams.
   Every diagram is drawn to show a MECHANISM, not to name parts.
   Colours use CSS custom properties so the diagrams stay in step with the palette.

   Helpers
     svg(w,h,body)      viewBox-scaled responsive frame
     tx(x,y,s,o)        single-line label            o: {size,fill,anchor,weight,style}
     txw(x,y,s,w,o)     wrapped label, w = chars per line
     bx(x,y,w,h,s,o)    rounded box whose text wraps and which grows to fit
     arr(x1,y1,x2,y2,o) arrow, optionally labelled   o: {label,dash,color,curve}
     ax(...)            a labelled pair of axes

   wider fallback font is substituted. Preserve that if you edit this file. */
(function () {
  'use strict';

    crimson: 'var(--crimson)', rule: 'var(--rule)', paper: 'var(--paper)', paper2: 'var(--paper-2)'

  function svg(w, h, body) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h +
      '" role="img" style="max-width:100%;height:auto;font-family:var(--sans)" ' +
      'xmlns="http://www.w3.org/2000/svg">' +
      '<defs>' +
        '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
          '<path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>' +
      '</defs>' + body + '</svg>';
  }

  function tx(x, y, s, o) {
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 12) + '" fill="' + (o.fill || C.ink2) +
      '" text-anchor="' + (o.anchor || 'start') + '" font-weight="' + (o.weight || 500) + '"' +
      (o.style ? ' font-style="' + o.style + '"' : '') +
      (o.mono ? ' font-family="var(--mono)"' : '') + '>' + s + '</text>';
  }

  function wrap(s, n) {
    var words = String(s).split(/\s+/), lines = [], cur = '';
    words.forEach(function (w) {
      if (!cur) { cur = w; }
      else if ((cur + ' ' + w).length <= n) { cur += ' ' + w; }
      else { lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function txw(x, y, s, n, o) {
    o = o || {};
    var size = o.size || 12, lh = o.lh || size * 1.28;
    return wrap(s, n).map(function (l, i) {
      return tx(x, y + i * lh, l, o);
    }).join('');
  }

  /* wrap to fit an available PIXEL width, honouring text-anchor.
     Use this for any label long enough to risk running past the viewBox. */
  function txfit(x, y, s, o) {
    o = o || {};
    var size = o.size || 12, avail = o.w || 200;
    /* bold faces are wider per character than regular ones */
    var per = (o.weight && o.weight >= 700) ? 0.585 : 0.548;
    var cpl = Math.max(8, Math.floor(avail / (size * per)));

  }

  function bx(x, y, w, s, o) {
    o = o || {};
    var size = o.size || 11.5, pad = o.pad || 8, cpl = Math.max(6, Math.floor((w - 2 * pad) / (size * 0.60)));
    var lines = wrap(s, cpl), lh = size * 1.3;

    var ty = y + h / 2 - (lines.length - 1) * lh / 2 + size * 0.35;
    body += lines.map(function (l, i) {
      return tx(x + w / 2, ty + i * lh, l, { size: size, fill: o.color || C.ink2, anchor: 'middle', weight: o.weight || 600 });

  }

  function arr(x1, y1, x2, y2, o) {

        '" stroke-width="' + (o.w || 1.6) + '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') +
        (o.noHead ? '' : ' marker-end="url(#ah)"') + '/>';
    } else {
      out += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col +
        '" stroke-width="' + (o.w || 1.6) + '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') +
        (o.noHead ? '' : ' marker-end="url(#ah)"') + (o.both ? ' marker-start="url(#ah)"' : '') + '/>';

  function ln(x1, y1, x2, y2, o) { o = o || {}; return arr(x1, y1, x2, y2, Object.assign({ noHead: true }, o)); }

  function dot(x, y, r, f) { return '<circle cx="' + x + '" cy="' + y + '" r="' + (r || 4) + '" fill="' + (f || C.navy) + '"/>'; }
  function ring(x, y, r, s, w) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + (s || C.ink3) + '" stroke-width="' + (w || 1.4) + '"/>'; }
  function path(d, o) {
    o = o || {};
    return '<path d="' + d + '" fill="' + (o.fill || 'none') + '" stroke="' + (o.stroke || C.navy) +
      '" stroke-width="' + (o.w || 2) + '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') +
      (o.cap ? ' stroke-linecap="' + o.cap + '"' : '') + (o.op ? ' opacity="' + o.op + '"' : '') + '/>';
  }
  function rect(x, y, w, h, o) {
    o = o || {};
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (o.rx || 0) +
      '" fill="' + (o.fill || 'none') + '" stroke="' + (o.stroke || 'none') + '" stroke-width="' + (o.w || 1) +
      '"' + (o.dash ? ' stroke-dasharray="' + o.dash + '"' : '') + (o.op ? ' opacity="' + o.op + '"' : '') + '/>';

    var d = '', i, t, x, y;

    }

  }

  var H = { svg: svg, tx: tx, txw: txw, txfit: txfit, bx: bx, arr: arr, ln: ln, dot: dot, ring: ring, path: path, rect: rect, ax: ax, fn: fn, wrap: wrap };
  D.H = H;
  window.PHY3201 = window.PHY3201 || {};
  window.PHY3201.diagramHelpers = H;
  window.PHY3201.diagrams = D.list = {};
})();

(function () {

    meaning: 'a cancels completely — the packing fraction is a pure number that depends only on the geometry of the arrangement, not on which element you build it from. Tungsten and sodium are both BCC and both have APF 0.68, despite densities that differ by a factor of twenty. Packing efficiency and mass density are different quantities.' },

    caption: '0.740 is the maximum possible packing fraction for identical spheres — a fact conjectured by Kepler in 1611 and proved only in 1998. Note diamond at 0.340: **directional covalent bonding beats packing efficiency**, and that open structure is precisely what lets dopant atoms sit in silicon without wrecking it.' },

  { t: 'h2', x: '4 · Surface (planar) density' },
  { t: 'p', x: 'Planar density counts atoms per unit *area* on a chosen plane. Unlike APF, it is different for every plane in the same crystal — which is exactly why it is useful.' },
  { t: 'diagram', id: 'planar-density', label: 'Figure 2.4',
    caption: 'Three planes through the same FCC crystal. Same material, different cuts, different atoms per unit area.' },
  { t: 'calc',

    known: 'Copper is FCC with a = 0.3615 nm.\nThe (100) plane is a cube face, of area a².',
    find: 'Atoms per unit area on (100)',
    equation: 'Atoms in the face:  4 corners × ¼  +  1 face centre × 1  =  2\nPD = atoms / area = 2 / a²',
    substitution: 'PD = 2 / (0.3615 nm)²\n   = 2 / 0.13068 nm²',
    answer: 'PD(100) = 15.30 atoms/nm² = 1.53 × 10¹⁹ atoms/m²',
    meaning: 'A corner atom is shared between four squares in the plane, so it contributes ¼ — the same shared-atom bookkeeping as in Topic 1, applied in two dimensions instead of three.' },
  { t: 'table',

    caption: 'For FCC the ordering is (111) > (100) > (110). The (111) plane is the close-packed plane of the FCC structure, which is why it is also the slip plane, the slowest-etching plane in silicon, and the plane on which epitaxial growth is usually easiest.' },
  { t: 'callout', kind: 'key', title: 'Why anyone outside a physics exam cares',
    x: 'Anisotropic wet etching of silicon in KOH removes (100) material roughly a hundred times faster than (111). That single ratio is what makes it possible to etch precise V-grooves and cantilevers into a wafer — the entire field of bulk-micromachined MEMS rests on a planar-density difference. Surface reaction rates, catalytic activity and oxidation rates all follow the same logic: which plane you expose sets how many atoms per unit area are available to react.' },

    title: 'Predicting the mass density of copper from its structure alone',

  { t: 'h2', x: '6 · Real crystals are not perfect' },
  { t: 'p', x: 'Everything so far has described a perfect infinite crystal. No such thing exists, and the deviations are not a nuisance — they are where most of materials engineering lives.' },

      ['Substitutional impurity', '0-D', 'A foreign atom on a lattice site. Phosphorus in silicon at parts per million — this is doping.'],

  { t: 'p', x: 'This is not an experimental failure and it is not a subtlety at the edge of detection. The intensity is exactly, identically zero. Understanding why is the point of this topic — and the answer, once you see it, hands you a way of reading lattice centring straight off a diffraction pattern.' },

  { t: 'h2', x: '1 · Periodic structure as a Fourier series' },
  { t: 'p', x: 'The electron density of a crystal is a periodic function of position: n(r + T) = n(r) for every lattice translation T. Any periodic function can be written as a Fourier series, and for a periodic function in three dimensions the allowed Fourier components are *exactly* the reciprocal lattice vectors.' },
  { t: 'eq', x: 'n(r)  =  Σ_G  n_G  exp(i G · r)\n\nn_G   =  (1/V) ∫_cell  n(r) exp(−i G · r) dV',
    note: 'The sum runs over reciprocal lattice vectors G and nothing else. Any other wavevector would give a function that does not have the periodicity of the crystal, so its coefficient must vanish.' },
  { t: 'diagram', id: 'fourier-density', label: 'Figure 4.1',
    caption: 'Adding Fourier components with the right amplitudes builds the electron density. More components resolve finer detail — which is the same statement as: measuring more reflections gives a sharper structural picture.' },
  { t: 'callout', kind: 'key', title: 'The idea that connects the whole topic',
    x: 'A diffraction experiment does not photograph a crystal. It **measures the Fourier coefficients n_G of the electron density, one reflection at a time.** The reciprocal lattice is not an abstraction bolted on afterwards — it is literally the list of spatial frequencies a periodic crystal is allowed to contain. That is why diffraction gives discrete spots rather than a continuous blur: only those frequencies exist.' },
  { t: 'callout', kind: 'note', title: 'The phase problem, in one sentence',
    x: 'A detector measures intensity, which is |F|². The phase of F is lost, and without phases you cannot simply inverse-Fourier-transform your way back to n(r). Recovering structure from intensities alone is the central technical problem of crystallography, and solving it was worth two Nobel Prizes.' },

  { t: 'h2', x: '2 · Brillouin zones in cubic lattices' },
  { t: 'p', x: 'Rewrite the Laue condition 2k·G + G² = 0 as 2k·(G/2) = (G/2)². Read geometrically, this says: **k must lie on the plane that perpendicularly bisects G.** Those bisecting planes are exactly the walls of the Brillouin zone.' },
  { t: 'diagram', id: 'brillouin-construction', label: 'Figure 4.2',
    caption: 'Building the first Brillouin zone: draw G to each neighbouring reciprocal-lattice point, bisect each one perpendicularly, and keep the smallest enclosed region. It is a Wigner–Seitz cell constructed in reciprocal space.' },
  { t: 'p', x: 'This is a much more important object than it looks at this stage. The Brillouin zone boundary is where the Bragg condition is satisfied, and consequently it is where **every** gap in the rest of the course opens: the phonon frequency plateau in Topic 6, the flat group velocity that kills heat transport, and the electronic band gap in Topic 9 all live on that boundary.' },
  { t: 'table',
    head: ['Direct lattice', 'Reciprocal lattice', 'Shape of the first Brillouin zone'],
    rows: [
      ['Simple cubic, a', 'Simple cubic, 2π/a', 'A cube of side 2π/a'],
      ['Body-centred cubic, a', 'Face-centred cubic', 'A rhombic dodecahedron (12 faces)'],
      ['Face-centred cubic, a', 'Body-centred cubic', 'A truncated octahedron (8 hexagons + 6 squares)']
    ],
    caption: 'The truncated-octahedron zone of the FCC lattice is the one you will meet again in every semiconductor band diagram — its high-symmetry points Γ, X, L and K are the labels along the horizontal axis of a silicon band structure.' },
  { t: 'callout', kind: 'note', title: 'Why the zone is built in reciprocal space, not real space',
    x: 'Because k, not r, is the natural variable for a wave in a periodic medium. Bloch\'s theorem (Topic 9) shows that every excitation in a crystal — phonon or electron — can be labelled by a wavevector, and that wavevectors differing by a reciprocal lattice vector describe the *same* physical state. Restricting k to one Brillouin zone removes that redundancy and nothing else.' },

  { t: 'h2', x: '3 · The structure factor' },
  { t: 'p', x: 'The scattered amplitude from one unit cell is the sum of the amplitudes from every atom in it, each carrying the phase appropriate to its position.' },
  { t: 'eq', x: 'F_hkl  =  Σ_j  f_j  exp[ 2πi ( h x_j  +  k y_j  +  l z_j ) ]',
    note: 'f_j is the atomic form factor of atom j, and (x_j, y_j, z_j) are its **fractional coordinates** within the cell. The measured intensity is I ∝ |F_hkl|². If F = 0 the reflection is *systematically absent*, however well Bragg’s law is satisfied.' },
  { t: 'diagram', id: 'structure-factor-cancel', label: 'Figure 4.3',
    caption: 'The BCC (100) case. The body-centre plane sits exactly halfway between the (100) planes, so its scattered wave is π out of phase and cancels the corner contribution exactly.' },
  { t: 'calc',
    title: 'Deriving the BCC selection rule',
    known: 'BCC has a two-point basis: (0,0,0) and (½,½,½), both the same atom, so f₁ = f₂ = f.',
    find: 'F_hkl, and the condition for it to vanish',
    equation: 'F = f · exp[2πi(0)] + f · exp[2πi(h/2 + k/2 + l/2)]\n  = f { 1 + exp[iπ(h + k + l)] }',
    substitution: 'If (h+k+l) is EVEN:  exp[iπ × even] = +1  →  F = 2f\nIf (h+k+l) is ODD:   exp[iπ × odd]  = −1  →  F = 0',
    answer: 'BCC: reflections are ALLOWED when h + k + l is even, ABSENT when it is odd.',
    meaning: 'Check it against the (100) case we opened with: 1 + 0 + 0 = 1, odd, therefore absent — exactly as observed. The first allowed BCC reflection is (110), and the sequence of h²+k²+l² values runs 2, 4, 6, 8, 10 …' },
  { t: 'calc',
    title: 'Deriving the FCC selection rule',
    known: 'FCC has a four-point basis: (0,0,0), (½,½,0), (½,0,½) and (0,½,½), all the same atom.',
    find: 'F_hkl and the condition for it to vanish',
    equation: 'F = f { 1 + e^{iπ(h+k)} + e^{iπ(h+l)} + e^{iπ(k+l)} }',
    substitution: 'h, k, l all EVEN  →  every exponent even  →  F = 4f\nh, k, l all ODD   →  each sum (h+k) etc. is even  →  F = 4f\nMIXED parity      →  two terms are +1, two are −1  →  F = 0',
    answer: 'FCC: reflections are ALLOWED when h, k and l are all even or all odd (unmixed parity), ABSENT when the parity is mixed.',
    meaning: 'The first FCC reflections are therefore (111), (200), (220), (311), (222) — the h²+k²+l² sequence 3, 4, 8, 11, 12. Compare that with the BCC sequence 2, 4, 6, 8: the ratio of the first two peaks alone distinguishes the two lattices.' },
  { t: 'widget', id: 'structure-factor-explorer', title: 'Structure factor and selection rules' },
  { t: 'diagram', id: 'selection-rules', label: 'Figure 4.4',
    caption: 'Twelve low-index reflections, three lattices. Filled = allowed, dashed = systematically absent. Reading a powder pattern means reading the pattern of absences, not only the peaks that are present.' },
  { t: 'h3', x: 'The diamond structure — an extra layer of cancellation' },
  { t: 'p', x: 'Silicon and diamond are FCC lattices with a two-atom basis, at (0,0,0) and (¼,¼,¼). The structure factor is then the FCC factor multiplied by a basis term:' },
  { t: 'eq', x: 'F  =  f · [FCC factor] · { 1 + exp[ i(π/2)(h + k + l) ] }',
    note: 'The FCC rule still applies, and on top of it the extra bracket vanishes whenever h+k+l ≡ 2 (mod 4). Both **(200)** and **(222)** pass the FCC test — all their indices are even — and both are nevertheless absent, because 2 mod 4 = 2 and 6 mod 4 = 2. Those two missing reflections are killed by the *second atom of the basis*, not by the lattice centring, and they are the signature of the diamond structure in a silicon powder pattern.' },
  { t: 'error',
    claim: '"A systematic absence means those planes do not exist."',
    why: 'The planes exist, they are correctly spaced, and Bragg\'s law is satisfied at the expected angle. What is absent is the *intensity*, because the waves scattered by different atoms within one unit cell cancel. Position and existence are separate questions: **Bragg’s law says where a reflection could be; the structure factor says whether anything arrives there.**' },
  { t: 'callout', kind: 'warn', title: 'A caution about absences',
    x: 'Centring rules tell you about the *lattice*, not the full structure. NaCl and KCl are both rock-salt, but K⁺ and Cl⁻ have almost identical form factors, so in KCl the "all-odd" FCC reflections nearly vanish and the pattern looks deceptively like a simple cubic lattice with half the parameter. Absences constrain the structure; they do not determine it on their own.' },

  { t: 'h2', x: 'Check yourself' },
  { t: 'check',
    q: 'Which of these reflections is allowed in FCC but forbidden in BCC?',
    options: ['(110)', '(111)', '(200)', '(220)'],
    answer: 1,
    why: '(111): all odd, so FCC allows it; h+k+l = 3 is odd, so BCC forbids it. (110) is the reverse case — BCC allows it, FCC forbids it as mixed parity. (200) and (220) are allowed in both.' },
  { t: 'check',
    q: 'A cubic powder pattern shows peaks with h²+k²+l² = 2, 4, 6, 8, 10, 12. What is the lattice?',
    options: ['Simple cubic', 'Body-centred cubic', 'Face-centred cubic', 'Diamond cubic'],
    answer: 1,
    why: 'All even values with no gaps in the even sequence is the BCC signature (h+k+l even). SC would give 1, 2, 3, 4, 5, 6…; FCC gives 3, 4, 8, 11, 12…; diamond gives 3, 8, 11, 16… with (222) missing.' },

  { t: 'h2', x: 'Exit challenge' },
  { t: 'callout', kind: 'key', title: 'Allowed, absent, and why',
    x: 'A cubic powder pattern contains reflections at h²+k²+l² = 3, 8, 11, 16, 19 but shows nothing at 4 or 12. **(a)** Test the observed reflections against the FCC rule. **(b)** Explain why 4 and 12 are missing, given that FCC would allow both. **(c)** Identify the structure type and name a material that has it. **(d)** Your colleague concludes from these absences that the two atoms in the basis must be identical. Evaluate that claim — is it required by the evidence, merely consistent with it, or contradicted?' },

  { t: 'read', items: [
    { book: 'Kittel, Ch. 2', where: 'Scattered Wave Amplitude → **Fourier Analysis** · **Brillouin Zones** (with the reciprocal lattices of the sc, bcc and fcc lattices worked separately) · **Fourier Analysis of the Basis** → Structure Factor of the bcc Lattice, Structure Factor of the fcc Lattice, Atomic Form Factor.' },
    { book: 'Hofmann, 1.3.1.3 · 1.3.1.6 · 4.1.2.2', where: '1.3.1.3 General Diffraction Theory and 1.3.1.6 X-Ray Diffraction from Periodic Structures develop the structure factor; the first Brillouin zone appears later, at 4.1.2.2, in the lattice-dynamics chapter. Hofmann is thinner than Kittel on cubic Brillouin-zone construction.' },
    { book: 'Ashcroft & Mermin, Ch. 5 and 6', where: 'Ch. 5 for the first Brillouin zone and the reciprocal lattices of sc, bcc and fcc; Ch. 6 for the geometrical structure factor and the atomic form factor.' },
    { book: 'Snoke, 1.4–1.5', where: 'Thin on this material, but useful for seeing reciprocal space introduced from the band-structure side, which is where Topic 9 will take it.' }
  ]}
  ]
};

window.PHY3201.pages.topic05 = {
  title: 'Crystal Bonding',
  navShort: 'Crystal Bonding',
  accent: 'bonding',
  hours: '6 lecture hours',
  weeks: 'Weeks 6–7',
  question: 'What holds a crystal together, and what sets the spacing?',
  eyebrow: ['Topic 05', '6 lecture hours', 'CLO1 · C4 · CLO2 · CTPS'],
  lede: 'Inert gas crystal systems · cohesive and repulsive energy · van der Waals–London interaction · types of bonding · ionic crystals · covalent crystals. This is the hinge of the course: bonding explains both why the structure of Topics 1–4 exists at all, and why it can vibrate the way Topics 6–7 require.',
  blocks: [

  { t: 'callout', kind: 'key', title: 'What you should be able to do by the end of this topic',
    x: 'Analyse the Lennard–Jones potential and explain equilibrium distance and crystal stability in noble gas solids · explain the balance between attractive and repulsive energies in determining interatomic spacing and material stiffness · relate van der Waals–London interactions to the physical properties of noble gas crystals · analyse the different types of crystal bonding based on interatomic potential energy models · explain ionic bonding using Born theory and the Madelung constant.' },

  { t: 'h2', x: 'Start here' },
  { t: 'p', x: 'Why do atoms in a crystal settle at a particular separation? Two questions are hiding in there. Why do they not fly apart — something must attract. And why do they not collapse into each other — something must repel, and it must win at short range. Every bonding mechanism in this topic is a different answer to *what* attracts, sitting on top of the same universal answer to what repels.' },

  { t: 'h2', x: '1 · The interatomic potential' },
  { t: 'p', x: 'Write the energy of a pair of atoms as a function of their separation, U(r). Force is the negative gradient:' },
  { t: 'eq', x: 'F(r)  =  − dU/dr\n\nEquilibrium:      dU/dr = 0        (net force zero)\nStable:           d²U/dr² > 0     (a minimum, not a maximum)' },
  { t: 'diagram', id: 'lj-potential', label: 'Figure 5.1',
    caption: 'The attractive and repulsive terms and their sum. Three numbers matter: where the minimum sits (r₀ → lattice parameter), how deep it is (ε → cohesive energy), and how sharply it curves (K → stiffness, and hence phonons).' },
  { t: 'callout', kind: 'key', title: 'Three properties from one curve',
    x: '**Position of the minimum** gives the equilibrium spacing and therefore the lattice parameter you measured in Topic 3. **Depth of the minimum** gives the cohesive energy, and correlates with melting point. **Curvature at the minimum** gives the effective spring constant K = d²U/dr², which Topic 6 turns directly into phonon frequencies. One curve, three chapters of the course.' },

  { t: 'h2', x: '2 · Where the repulsion comes from' },
  { t: 'p', x: 'The short-range repulsion is not electrostatic — it is the **Pauli exclusion principle**. As two closed-shell atoms are pushed together their electron clouds must overlap, and since the low-lying orbitals are already full, electrons are forced into higher-energy states. The energy cost rises extremely steeply.' },
  { t: 'p', x: 'Two empirical forms are in common use. The inverse-power form U_rep = A/r¹² is mathematically convenient (it is just the square of the r⁻⁶ term, which makes the algebra tidy) and has no deeper justification. The exponential Born–Mayer form U_rep = λ exp(−r/ρ) is more faithful to the physics, because wavefunctions decay exponentially. The choice matters for accuracy, not for the qualitative picture.' },

  { t: 'h2', x: '3 · Inert-gas crystals and the van der Waals–London interaction' },
  { t: 'p', x: 'Solid argon is the cleanest test case in the whole of bonding theory. Argon atoms are neutral, spherical and closed-shell. They have no permanent dipole, no charge to transfer and no orbitals available to share. By every naive argument they should not condense at all — and yet argon freezes at 84 K into a well-behaved FCC crystal.' },
  { t: 'diagram', id: 'vdw-mechanism', label: 'Figure 5.2',
    caption: 'The London mechanism. A quantum fluctuation gives one atom an instantaneous dipole; that dipole polarises its neighbour; the induced dipole is always oriented so the interaction is attractive.' },
  { t: 'eq', x: 'U_attr  ∝  − 1 / r⁶',
    note: 'The 1/r⁶ arises because a dipole field falls off as 1/r³, and the induced dipole it creates is itself proportional to that field — giving another 1/r³. The interaction is a *quantum* effect: it survives even at absolute zero, where classical thermal fluctuations would have stopped.' },
  { t: 'h3', x: 'The Lennard-Jones potential' },
  { t: 'eq', x: 'U(r)  =  4ε [ (σ/r)¹²  −  (σ/r)⁶ ]',
    note: 'ε is the depth of the well; σ is the separation at which U = 0. For a single isolated pair, dU/dr = 0 gives r₀ = 2^(1/6) σ = 1.1225 σ.' },
  { t: 'table',
    head: ['Inert gas', '~ε (eV)', '~σ (Å)', '~Melting point (K)', '~Cohesive energy, observed (eV/atom)'],
    rows: [
      ['Ne', '0.0031', '2.74', '24', '0.02'],
      ['Ar', '0.0104', '3.40', '84', '0.080'],
      ['Kr', '0.0140', '3.65', '117', '0.116'],
      ['Xe', '0.0200', '3.98', '161', '0.17']
    ],
    caption: 'ε rises monotonically down the group because heavier atoms are more polarisable — bigger, looser electron clouds fluctuate more easily. Melting point tracks ε almost exactly, which is about as direct a link between a microscopic parameter and a bulk property as this course offers.' },
  { t: 'widget', id: 'bond-energy-explorer', title: 'Bond energy explorer' },
  { t: 'calc',
    title: 'Cohesive energy of solid argon from the Lennard-Jones model',
    known: 'FCC structure. Summing the pair potential over the whole FCC lattice gives the standard lattice sums\nΣ(σ/r)¹² = 12.13188 · (σ/R)¹²   and   Σ(σ/r)⁶ = 14.45392 · (σ/R)⁶,\nwhere R is the nearest-neighbour distance. For argon ε = 0.0104 eV, σ = 3.40 Å.',
    find: 'The equilibrium nearest-neighbour distance R₀ and the cohesive energy per atom',
    equation: 'U_total = 2Nε [ 12.13188 (σ/R)¹² − 14.45392 (σ/R)⁶ ]\nSet dU/dR = 0  →  R₀/σ = (2 × 12.13188 / 14.45392)^(1/6)',
    substitution: 'R₀/σ = (1.6787)^(1/6) = 1.0902\nR₀   = 1.0902 × 3.40 Å = 3.71 Å\nU(R₀)/N = 2 × 0.0104 × (12.13188/1.0902¹² − 14.45392/1.0902⁶)\n        = 2 × 0.0104 × (−4.303)',
    answer: 'R₀ = 3.71 Å, cohesive energy = 0.0895 eV per atom  (observed: 3.76 Å and 0.080 eV)',
    meaning: 'Two things are worth noticing. First, the lattice sum gives R₀/σ = 1.09, **not** the isolated-pair value of 1.1225 — every atom feels twelve neighbours, not one, and the many-body sum pulls the equilibrium slightly inward. Second, we over-predict the cohesive energy by about 12 %. That discrepancy is real physics: zero-point vibrational energy, which this classical treatment ignores, holds the atoms slightly apart and reduces the binding. The effect is largest for neon, the lightest gas — exactly as a quantum explanation would predict.' },

  { t: 'h2', x: '4 · Ionic crystals: the Madelung sum' },
  { t: 'p', x: 'Now change the attractive mechanism. In NaCl an electron transfers from sodium to chlorine, and what remains are two closed-shell ions with opposite charge. The attraction is now plain Coulomb — strong, long-ranged, and much larger than any van der Waals term.' },
  { t: 'p', x: 'But the sum is delicate. The nearest neighbours attract, the next shell out repels, the shell beyond that attracts again. You cannot stop after the first shell.' },
  { t: 'diagram', id: 'madelung-chain', label: 'Figure 5.3',
    caption: 'The one-dimensional alternating chain, where the sum can be done in closed form. Each successive shell contributes with the opposite sign and a smaller magnitude.' },
  { t: 'eq', x: 'One-dimensional chain:\n\n  α  =  2 ( 1 − 1/2 + 1/3 − 1/4 + 1/5 − … )  =  2 ln 2  =  1.3863',
    note: 'The factor 2 counts both directions along the chain. The series is the alternating harmonic series — it converges, but slowly. Stopping at the nearest neighbours would give α = 2, an overestimate of 44 %.' },
  { t: 'eq', x: 'Total energy of an ionic crystal (Born model):\n\n  U_total  =  − N [ α q² / (4πε₀ R) ] · ( 1 − ρ/R )',
    note: 'The first bracket is the Madelung (electrostatic) energy; the (1 − ρ/R) factor is what the Born–Mayer repulsion contributes at equilibrium. ρ is the repulsion range parameter, typically ~0.3 Å — about a tenth of a bond length, which is why the repulsive correction is only around 10 %.' },
  { t: 'table',
    head: ['Structure', '~Madelung constant α', 'Coordination', 'Example'],
    rows: [
      ['Sodium chloride (rock salt)', '1.747565', '6', 'NaCl, KCl, MgO, LiF'],
      ['Caesium chloride', '1.762675', '8', 'CsCl, CsBr, NH₄Cl'],
      ['Zincblende (cubic ZnS)', '1.6381', '4', 'ZnS, GaAs, InP'],
      ['1-D alternating chain', '1.3863 (= 2 ln 2)', '2', 'A teaching model, not a material']
    ],
    caption: 'α depends on the *geometry* of the arrangement and nothing else — not on the ion sizes, not on the element. Higher coordination gives a slightly larger α, which is one reason CsCl-type structures are favoured when the cation is large enough to support eight neighbours.' },
  { t: 'calc',
    title: 'Cohesive energy of NaCl relative to free ions',
    known: 'Rock salt: α = 1.747565.  R₀ = 2.81 Å.  ρ = 0.321 Å.\nq = e, and e²/(4πε₀) = 14.3996 eV·Å.',
    find: 'The cohesive energy per ion pair',
    equation: 'U = − [ α e²/(4πε₀ R₀) ] · ( 1 − ρ/R₀ )',
    substitution: 'Coulomb term  = 1.747565 × 14.3996 / 2.81  = 8.955 eV\nRepulsive factor = 1 − 0.321/2.81 = 0.8858\nU = − 8.955 × 0.8858',
    answer: 'U = − 7.93 eV per ion pair  (accepted value 7.95 eV — agreement to 0.3 %)',
    meaning: 'Two things this tells you. The **Madelung term does almost all the work**: 8.96 eV of the 7.93 eV binding, with the repulsion giving back about 11 %. And a simple electrostatic model with two fitted parameters reproduces the measured lattice energy of a real salt to better than half a percent — which is why the Born model has survived a century. Note the energy referenced here is to *free ions*, not to free atoms; converting between the two requires the ionisation energy of Na and the electron affinity of Cl.' },

  { t: 'h2', x: '5 · The four bonding types' },
  { t: 'diagram', id: 'bonding-types', label: 'Figure 5.4',
    caption: 'Where the valence electrons sit, in each of the four idealised bonding mechanisms. Real solids mix them.' },
  { t: 'table',
    head: ['Type', 'Mechanism', '~Cohesive energy (eV/atom)', 'Directional?', 'Consequences'],
    rows: [
      ['van der Waals', 'Fluctuating dipoles', '0.02 – 0.2', 'No', 'Low melting point, soft, insulating, highly compressible'],
      ['Hydrogen bond', 'Shared proton between electronegative atoms', '0.1 – 0.5', 'Yes', 'The reason ice floats and water boils at 100 °C'],
      ['Ionic', 'Electron transfer, then Coulomb attraction', '3 – 5 per atom (5 – 10 per ion pair)', 'No', 'Hard, brittle, high melting point, insulating when solid, conducting when molten'],
      ['Covalent', 'Electron sharing in directed orbitals', '3 – 8', 'Strongly', 'Very hard, high melting point, low coordination, semiconducting or insulating'],
      ['Metallic', 'Valence electrons delocalised over the crystal', '1 – 9', 'No', 'Ductile, opaque, high electrical and thermal conductivity']
    ],
    caption: 'Cohesive energies from the standard tables: Ne 0.02, Ar 0.080, Na 1.11, Cu 3.49, Ge 3.85, Fe 4.28, Si 4.63, C (diamond) 7.37, W 8.90 eV/atom. **Watch the convention for ionic solids:** NaCl is usually quoted as 7.93 eV per *ion pair* relative to free ions, which is only about 4.0 eV per atom — comparable to silicon, not larger. Tungsten\'s 8.90 eV per atom is why it melts at 3422 °C and ends up in every furnace element.' },
  { t: 'callout', kind: 'note', title: 'Directionality is the property that matters most',
    x: 'Ionic and metallic bonds are non-directional: the energy depends on how far the neighbours are, not where. Those solids therefore pack as densely as they can — which is why metals are FCC, BCC or HCP with coordination 8 or 12. Covalent bonds *are* directional, with fixed angles set by orbital hybridisation, and a crystal must accept a much lower packing fraction to satisfy them. Silicon\'s APF of 0.340, less than half that of copper, is the price of tetrahedral sp³ bonding — and the resulting open structure is exactly what makes doping possible.' },
  { t: 'p', x: 'Non-directional bonding also explains ductility. In a metal, sliding one plane of atoms over another changes which neighbours an ion has, but every position is much like every other, so the energy penalty is modest and dislocations glide. In a covalent crystal the same slip must break specific directed bonds, which costs far more — so diamond and silicon fracture rather than flow. In an ionic crystal, slip would bring like charges into contact, which is catastrophic; hence brittleness.' },

  { t: 'h2', x: '6 · Same element, different bonding' },
  { t: 'diagram', id: 'diamond-vs-graphite', label: 'Figure 5.5',
    caption: 'Carbon in two hybridisations. sp³ gives a rigid three-dimensional network; sp² gives strong sheets held together only by van der Waals forces.' },
  { t: 'table',
    head: ['', 'Diamond (sp³)', 'Graphite (sp²)'],
    rows: [
      ['Bonding', '4 σ bonds, 109.5° tetrahedral', '3 σ bonds at 120° in-plane, delocalised π; van der Waals between sheets'],
      ['Hardness', 'Hardest known material', 'Soft enough to write with'],
      ['Electrical', 'Insulator, gap 5.5 eV', 'Conducts in-plane; the π electrons are delocalised'],
      ['Thermal', 'Exceptional conductor — a stiff, light, near-harmonic lattice', 'Good in-plane, poor across the sheets'],
      ['Density', '3.51 g/cm³', '2.27 g/cm³']

    caption: 'Every difference in this table follows from the bonding geometry. Nothing has been added to the carbon.' },
  { t: 'error',
    claim: '"Material A has a deeper potential well than B, therefore A is harder, melts higher, and conducts heat better."',
    why: 'A deeper well does mean stronger binding, and it correlates reasonably with melting point. But **hardness** is governed by dislocation motion and bond directionality, not well depth — MgO and NaCl share a structure and a bonding type, yet MgO is several times harder because its doubly charged ions bind far more stiffly against shear. **Thermal conductivity** depends on phonon velocity and mean free path (Topic 7), and a highly anharmonic strongly bound crystal can conduct heat poorly. The correct move is to name which mechanism connects the well depth to the property in question, and to say where the connection stops.' },

  { t: 'h2', x: '7 · The bridge to Topic 6' },
  { t: 'p', x: 'Expand U(r) about the minimum in a Taylor series. The linear term vanishes because we are at a minimum, so to leading order:' },
  { t: 'eq', x: 'U(r₀ + x)  ≈  U(r₀)  +  ½ K x²        where  K = (d²U/dr²)|_{r₀}\n\nF  =  − dU/dx  =  − K x',
    note: 'This is Hooke\'s law. The **harmonic approximation** turns every bond in the crystal into a spring of stiffness K, and that is precisely the model Topic 6 solves.' },
  { t: 'callout', kind: 'key', title: 'One equation, the rest of the course',

  { t: 'h2', x: 'Start here' },

  { t: 'h2', x: '2 · Quantising the oscillators' },

  { t: 'eq', x: '⟨n(ω)⟩  =  1 / [ exp(ħω / k_BT)  −  1 ]\n\n⟨E⟩     =  ( ⟨n⟩ + ½ ) ħω',

    ],
    caption: 'Per mole the low-temperature coefficient is (12π⁴/5)R = 233.78 × 8.314 = 1944 J mol⁻¹ K⁻¹, so C_V = 1944 (T/Θ_D)³ J mol⁻¹ K⁻¹. The T³ law is one of the most precisely verified predictions in solid state physics.' },
  { t: 'diagram', id: 'einstein-vs-debye', label: 'Figure 7.1',
    caption: 'Both models reach Dulong–Petit at high temperature. They part company at low temperature, and only Debye matches experiment.' },
  { t: 'widget', id: 'heat-capacity-explorer', title: 'Heat capacity explorer' },
  { t: 'callout', kind: 'key', title: 'What Θ_D actually measures',
    x: 'Θ_D = (ħ v_s/k_B)(6π²n)^{1/3}. It is not an arbitrary fitting parameter — it is a **stiffness-and-mass thermometer**. Stiff bonds give a high sound velocity; light atoms raise it further. Diamond has both: stiff sp³ bonds and the lightest atom that can form them, giving Θ_D = 2230 K. Lead has soft metallic bonds and a heavy nucleus: Θ_D = 105 K. That factor of twenty traces straight back to the potential-well curvature of Topic 5.' },
  { t: 'table',
    head: ['Material', '~Θ_D (K)', '~Debye ν_D (THz)', 'Bonding and mass'],
    rows: [
      ['Lead', '105', '2.2', 'Soft metallic, A = 207'],
      ['Sodium', '158', '3.3', 'Very soft metallic, low valence'],
      ['Silver', '225', '4.7', 'Metallic, A = 108'],
      ['Copper', '343', '7.1', 'Metallic, A = 63.5'],
      ['Aluminium', '428', '8.9', 'Metallic, light, A = 27'],
      ['Silicon', '645', '13.4', 'Covalent, directional, A = 28'],
